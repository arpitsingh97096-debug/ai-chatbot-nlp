<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA — AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="noise-overlay"></div>
<div class="app" id="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-orb">
                    <svg viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="14" stroke="url(#brandGrad)" stroke-width="2"/>
                        <path d="M10 16 Q16 8 22 16 Q16 24 10 16Z" fill="url(#brandGrad)"/>
                        <defs>
                            <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32">
                                <stop offset="0%" stop-color="#a78bfa"/>
                                <stop offset="100%" stop-color="#38bdf8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="brand-name">ARIA</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle" title="Collapse">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
        </div>
        <button class="new-chat-btn" onclick="newChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>New Conversation</span>
        </button>
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="search-chat" class="search-input" placeholder="Search conversations…" autocomplete="off"/>
        </div>
        <div class="chat-list-wrap">
            <div id="chat-list" class="chat-list"></div>
        </div>
        <div class="sidebar-footer">
            <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                </svg>
                <span>Appearance</span>
            </button>
        </div>
    </aside>
    <main class="main">
        <header class="topbar">
            <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="topbar-center">
                <div class="status-dot"></div>
                <span id="chat-title-bar">ARIA — Ready</span>
            </div>
            <div class="topbar-actions">
                <button class="action-icon-btn" title="Clear chat" onclick="clearCurrentChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
                    </svg>
                </button>
            </div>
        </header>
        <div class="chat-box" id="chat-box">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-orb">
                    <div class="orb-ring r1"></div>
                    <div class="orb-ring r2"></div>
                    <div class="orb-ring r3"></div>
                    <div class="orb-core">
                        <svg viewBox="0 0 48 48" fill="none">
                            <path d="M14 24 Q24 10 34 24 Q24 38 14 24Z" fill="url(#wGrad)"/>
                            <defs>
                                <linearGradient id="wGrad" x1="0" y1="0" x2="48" y2="48">
                                    <stop offset="0%" stop-color="#a78bfa"/>
                                    <stop offset="100%" stop-color="#38bdf8"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>
                <h1 class="welcome-title">Hello, I'm <span class="gradient-text">ARIA</span></h1>
                <p class="welcome-sub">Your advanced AI assistant. Ask me anything.</p>
                <div class="suggestion-chips">
                    <button class="chip" onclick="useSuggestion(this)">Explain quantum computing</button>
                    <button class="chip" onclick="useSuggestion(this)">Write a Python script</button>
                    <button class="chip" onclick="useSuggestion(this)">Summarize a topic</button>
                    <button class="chip" onclick="useSuggestion(this)">Help me brainstorm ideas</button>
                </div>
            </div>
        </div>
        <div class="input-zone">
            <div class="input-container" id="input-container">
                <textarea id="user-input" class="user-input" placeholder="Message ARIA…" rows="1" autocomplete="off"></textarea>
                <div class="input-actions">
                    <div class="input-left">
                        <button class="input-icon-btn voice-btn" id="voiceBtn" title="Voice input">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                                <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-right">
                        <span class="char-count" id="charCount">0</span>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
        </div>
    </main>
</div>
<div class="context-menu" id="contextMenu">
    <button class="ctx-item" id="ctxPin">📌 Pin</button>
    <button class="ctx-item" id="ctxRename">✏️ Rename</button>
    <button class="ctx-item ctx-danger" id="ctxDelete">🗑 Delete</button>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
